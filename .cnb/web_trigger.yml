# 手动构建入口说明 (原按钮已移除)
#
# kernel / full 构建需要 512G 持久工作区, 流水线 runner 磁盘不足,
# 统一改为在云原生开发环境内手动执行:
#
#   bash build.sh kernel    # 内核 + dtb (增量, 约 20 分钟起)
#   bash build.sh full      # 完整 ROM + 源码环境备份 (增量)
#
# 构建成功后自动发布到仓库 Release 页面 (release_upload.sh):
#   - 发布令牌: 环境变量 CNB_TOKEN 或 /workspace/.secrets/cnb_token
#   - 详见 README.md「产物发布」章节
