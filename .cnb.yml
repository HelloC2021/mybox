# KC2/K10Plus Android 11 (RK3399) CNB 构建流水线
# 语法参考: https://docs.cnb.cool/zh/build/configuration.html
# 资源: amd64 节点最高 64 核 / 单任务最长 18 小时
# 手动触发按钮定义在 .cnb/web_trigger.yml

# 云原生开发环境 (10 核, 512G 持久工作区)
#
# 镜像策略: 只保留 build, 不设 image 回退。
#   - Android 11 (AOSP) 官方仅支持 Ubuntu 18.04/20.04, 必须由 .ide/Dockerfile
#     在 ubuntu:20.04 上构建 (repo/ccache/gcc-multilib/aarch64 交叉工具链/locale)。
#   - 若声明同级 image: cnbcool/default-dev-env 作为回退, 构建失败时会静默退到该
#     默认镜像, 其基线非 ubuntu:20.04, AOSP 编译依赖缺失 —— 环境看似可用但 build.sh
#     会失败, 且掩盖真实报错。故此处坚持 build-only: 镜像构建失败即失败暴露。
#   - .ide/Dockerfile 已装 openssh-server (本地 VSCode Remote-SSH) + code-server +
#     cnbcool.cnb-welcome/coding-copilot/codebuddy (面板插件), 无需依赖默认镜像。
$:
  vscode:
    - runner:
        tags: cnb:arch:amd64
        cpus: 10
      docker:
        build: .ide/Dockerfile
      services:
        - vscode

main:
  push:
    # 轻量校验: 每次推送自动执行 (秒级, 不触发重量级源码同步)
    - name: lint
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: ubuntu:20.04
      stages:
        - name: syntax-and-patch-check
          script: |
            bash -n build.sh && echo "build.sh 语法 OK"
            test -f patches/remotectl_mouse_4.19.patch && echo "鼠标补丁 OK"
            test -f dts/kc2_override.dts && echo "KC2 dts 覆盖 OK"
            test -f device_overlay/kc2_rom.mk && echo "ROM 定制层 OK"
            bash -n .ide/first_run.sh && echo "first_run.sh 语法 OK"
            grep -q "code-server --install-extension cnbcool.cnb-welcome" .ide/Dockerfile && echo "CNB 插件补齐 OK"
            grep -q "@tencent-ai/codebuddy-code" .ide/Dockerfile && echo "codebuddy 补齐 OK"
            grep -q "FROM ubuntu:20.04" .ide/Dockerfile && echo "云开发镜像基线 ubuntu:20.04 OK"
            grep -q "openssh-server" .ide/Dockerfile && echo "Remote-SSH 支持 OK"
            grep -q "^        build: .ide/Dockerfile" .cnb.yml && echo "开发镜像 build-only OK"
            ! grep -qE "^\s*image: cnbcool/default-dev-env" .cnb.yml && echo "无回退镜像 OK"
            # Dockerfile 中 COPY 的源路径相对构建上下文根 (/workspace), 必须真实存在
            while read -r src; do
              test -e "$src" || { echo "ERROR: Dockerfile COPY 源不存在: $src"; exit 1; }
            done < <(grep -oE '^COPY [^ ]+' .ide/Dockerfile | awk '{print $2}')
            echo "Dockerfile COPY 源路径 OK"

# 任意分支可手动触发 (分支详情页按钮, 按钮定义在 .cnb/web_trigger.yml)
"**":
  web_trigger_rom_kernel:
    - name: kc2-atv-kernel
      runner:
        tags: cnb:arch:amd64
        cpus: 16
      docker:
        image: ubuntu:20.04
      env:
        STAGE: kernel
      stages:
        - name: sync-and-build-kernel
          script: bash build.sh kernel

  web_trigger_rom_full:
    - name: kc2-atv-full-rom
      runner:
        tags: cnb:arch:amd64
        cpus: 32
      docker:
        image: ubuntu:20.04
      env:
        STAGE: full
      stages:
        - name: sync-and-build-full-rom
          script: bash build.sh full
